server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ảnh scan bệnh án thường vài MB; mặc định của nginx chỉ 1MB nên upload
        # bị chặn ngay tại proxy với lỗi 413, chưa kịp tới backend.
        # Giữ khớp với EXTRACTION_MAX_FILE_MB ở backend.
        client_max_body_size 25m;

        # Bóc tách bằng AI mất từ vài giây tới vài phút -> nới timeout, nếu không
        # nginx cắt kết nối giữa chừng và người dùng thấy lỗi 504.
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
